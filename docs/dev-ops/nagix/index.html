<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康管理 - 月月友</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/phone-shell.css">
    <link rel="stylesheet" href="css/polish.css">
</head>
<body>

<div class="header">
    <div class="app-title">月月友</div>
    <div class="header-controls">
        <div class="avatar-container">
            <div class="avatar" id="user-avatar"></div>
            <div class="username" id="user-name">加载中...</div>
        </div>
    </div>
</div>

<div class="content-scroll">

    <div class="glass-panel ai-card">
        <div class="ai-text" id="ai-suggestion">正在分析您的健康状态...</div>
    </div>

    <div class="glass-panel no-padding animation-container">
        <canvas id="journeyCanvas"></canvas>
    </div>

    <div class="glass-panel action-area" id="action-area">
        <div class="action-col">
            <div class="date-box" id="date-come">--月--日</div>
            <button class="circle-btn btn-come" id="btn-come">来</button>
        </div>
        <div class="center-col">
            <div class="cloud-btn" id="btn-what">发生了什么</div>
            <div class="arrow"></div>
            <div class="cloud-btn" id="btn-status">状态如何</div>
        </div>
        <div class="action-col">
            <div class="date-box" id="date-go">--月--日</div>
            <button class="circle-btn btn-go" id="btn-go">走</button>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" data-href="index.html" role="button" tabindex="0">主页</div>
    <div class="nav-item" data-href="data.html" role="button" tabindex="0">数据</div>
    <div class="nav-item" data-href="mine.html" role="button" tabindex="0">我的</div>
</div>

<div class="modal-overlay" id="custom-modal">
    <div class="glass-box">
        <div class="modal-title">提示</div>
        <div class="modal-msg" id="modal-msg">确认操作吗？</div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modal-cancel">取消</button>
            <button class="modal-btn modal-btn-confirm" id="modal-confirm">确认</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="symptom-record-modal">
    <div class="glass-box">
        <div class="close-btn" data-close="symptom-record-modal" role="button" tabindex="0">×</div>
        <div class="modal-title modal-title-tight">今日状态打卡</div>
        <div class="symptom-list">
            <div class="symptom-row" data-symptom="pain" role="button" tabindex="0">
                <span class="symptom-label">痛经程度</span>
                <div class="symptom-val" id="val-pain">正常</div>
            </div>
            <div class="symptom-row" data-symptom="flow" role="button" tabindex="0">
                <span class="symptom-label">流量大小</span>
                <div class="symptom-val" id="val-flow">正常</div>
            </div>
            <div class="symptom-row" data-symptom="mood" role="button" tabindex="0">
                <span class="symptom-label">心情状态</span>
                <div class="symptom-val" id="val-mood">开心</div>
            </div>
            <div class="symptom-row" data-symptom="note" role="button" tabindex="0">
                <span class="symptom-label">额外备注</span>
                <div class="symptom-val symptom-note-preview" id="val-note">无</div>
            </div>
        </div>
        <button class="record-submit-btn" id="btn-submit-symptom">记录完成</button>
    </div>
</div>

<div class="modal-overlay" id="symptom-options-modal">
    <div class="glass-box symptom-options-box">
        <div class="close-btn" data-close="symptom-options-modal" role="button" tabindex="0">×</div>
        <div class="options-container" id="options-container">
        </div>
    </div>
</div>

<div class="modal-overlay" id="symptom-note-modal">
    <div class="glass-box">
        <div class="modal-title">写点悄悄话</div>
        <textarea class="note-input" id="note-textarea" placeholder="今天感觉怎么样？写在这里吧..."></textarea>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" data-close="symptom-note-modal">返回</button>
            <button class="modal-btn modal-btn-confirm" id="btn-save-note">保存</button>
        </div>
    </div>
</div>
<script src="js/ui-enhance.js"></script>
<script src="js/index.js"></script>
</body>
</html>
