<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据中心 - 月月友</title>
    <link rel="stylesheet" href="css/data.css">
    <link rel="stylesheet" href="css/phone-shell.css">
    <link rel="stylesheet" href="css/polish.css">
</head>
<body>

<div class="header">
    <div class="app-title">月月友</div>
    <div class="header-controls">
        <select class="count-select" id="countSelector">
            <option value="3" selected>前 3 次</option>
            <option value="5">前 5 次</option>
            <option value="10">前 10 次</option>
        </select>
        <div class="avatar-container">
            <div class="avatar" id="user-avatar"></div>
            <div class="username" id="user-name">加载中...</div>
        </div>
    </div>
</div>

<div class="content-scroll">
    <div class="glass-panel stats-grid">
        <div class="stat-box">
            <div class="stat-label">平均周期长度</div>
            <div class="stat-val" id="avg-cycle">--<span class="stat-unit">天</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">平均行经期</div>
            <div class="stat-val" id="avg-period">--<span class="stat-unit">天</span></div>
        </div>
    </div>

    <div class="glass-panel" id="calendarPanel">
        <div class="cal-header">
            <button class="cal-nav-btn" id="btn-prev-month">◀</button>
            <div class="cal-title" id="calendar-title">2026 年 06 月</div>
            <button class="cal-nav-btn" id="btn-next-month">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
        </div>
    </div>

    <div class="glass-panel">
        <div class="cal-title chart-title">周期趋势追踪</div>
        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>
        <div class="chart-legend">
            <div class="legend-item"><div class="dot-period"></div>行经天数</div>
            <div class="legend-item"><div class="dot-interval"></div>周期天数</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" data-href="index.html" role="button" tabindex="0">主页</div>
    <div class="nav-item active" data-href="data.html" role="button" tabindex="0">数据</div>
    <div class="nav-item" data-href="mine.html" role="button" tabindex="0">我的</div>
</div>
<script src="js/ui-enhance.js"></script>
<script src="js/data.js"></script>
</body>
</html>
