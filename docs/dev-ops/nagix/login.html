<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>月月友 - 登录与注册</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/phone-shell.css">
    <link rel="stylesheet" href="css/polish.css">
</head>
<body>

<div class="system-title-card">
    <div class="system-title">月月友生理期记录系统</div>
</div>

<div class="auth-card">
    <div class="input-group">
        <div class="label-shape shape-cloud">用户名</div>
        <input type="text" id="inp-username" class="custom-input" placeholder="请输入用户名" autocomplete="off">
    </div>

    <div class="input-group hidden" id="group-phone">
        <div class="label-shape shape-flag">电话</div>
        <input type="tel" id="inp-phone" class="custom-input" placeholder="请输入手机号" autocomplete="off">
    </div>

    <div class="input-group">
        <div class="label-shape shape-paper">密码</div>
        <input type="password" id="inp-password" class="custom-input" placeholder="请输入密码">
    </div>

    <div class="password-hint" id="pwd-hint">
        <span class="hint-item" id="hint-len">至少8个字符</span>
        <span class="hint-item" id="hint-letter">包含字母 (a-z, A-Z)</span>
        <span class="hint-item" id="hint-num">包含数字 (0-9)</span>
        <span class="hint-item" id="hint-sym">包含符号 (如 !@#$%)</span>
    </div>

    <button class="submit-btn" id="btn-submit">gogogo</button>
</div>

<div class="toggle-text" id="btn-toggle">没有账号，点击注册</div>

<div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
        <div class="modal-title">提示</div>
        <div class="modal-msg" id="modal-msg">...</div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-confirm" id="modal-confirm">我知道了</button>
        </div>
    </div>
</div>
<script src="js/ui-enhance.js"></script>
<script src="js/login.js"></script>
</body>
</html>
