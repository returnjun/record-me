<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>月月友 - 登录与注册</title>
    <style>
        /* ================= 基础重置与全局样式 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        }

        body {
            background: linear-gradient(120deg, #ffe2ed 0%, #eadaff 25%, #d4f7ff 50%, #e0fbf2 75%, #ffe2ed 100%);
            background-size: 200% 200%;
            animation: auroraBreathe 12s ease infinite;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes auroraBreathe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 标题模块 ================= */
        .system-title-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(162, 169, 255, 0.2);
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .system-title-card:hover {
            transform: translateY(-3px);
        }

        .system-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff7eb3 0%, #9d7dfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            user-select: none;
        }

        /* ================= 表单毛玻璃卡片 ================= */
        .auth-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(162, 169, 255, 0.15);
            width: 85%;
            max-width: 360px;
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .auth-card:hover {
            box-shadow: 0 20px 50px rgba(162, 169, 255, 0.25);
            background: rgba(255, 255, 255, 0.75);
        }

        /* ================= 输入框组 ================= */
        .input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.4s ease;
            max-height: 60px;
            opacity: 1;
            overflow: hidden;
        }

        .input-group.hidden {
            max-height: 0;
            opacity: 0;
            margin-top: -25px;
            pointer-events: none;
        }

        .label-shape {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 65px;
            height: 36px;
            background: #fff;
            font-size: 13px;
            font-weight: 700;
            color: #9d7dfa;
            border: 1.5px solid #eadaff;
            box-shadow: 0 4px 10px rgba(157, 125, 250, 0.1);
            user-select: none;
        }

        .shape-cloud {
            border-radius: 20px;
        }

        .shape-flag {
            border-radius: 15px 0 15px 0;
            color: #17c3b2;
            border-color: #a7ebe4;
        }

        .shape-paper {
            border-radius: 4px 15px 15px 4px;
            color: #ff7eb3;
            border-color: #ffb6c1;
        }

        .custom-input {
            flex: 1;
            height: 42px;
            border: 1.5px solid transparent;
            border-radius: 12px;
            padding: 0 15px;
            font-size: 15px;
            color: #555;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
            outline: none;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background: #fff;
            border-color: #9d7dfa;
            box-shadow: 0 0 0 4px rgba(157, 125, 250, 0.15);
        }

        .custom-input::placeholder {
            color: #bbb;
            font-size: 14px;
        }

        /* ================= 核心操作按钮 ================= */
        .submit-btn {
            margin-top: 10px;
            height: 48px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, #ff7eb3 0%, #9d7dfa 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(157, 125, 250, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(157, 125, 250, 0.5);
            filter: brightness(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95) translateY(2px);
            box-shadow: 0 4px 10px rgba(157, 125, 250, 0.2);
            transition: all 0.1s ease;
        }

        /* ================= 底部切换文字 ================= */
        .toggle-text {
            margin-top: 25px;
            font-size: 14px;
            color: #8390c1;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        .toggle-text:hover {
            color: #9d7dfa;
            text-decoration: underline;
        }

        /* ================= 自定义弹窗 ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            border-radius: 24px;
            padding: 30px 25px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #444;
            margin-bottom: 12px;
        }

        .modal-msg {
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 15px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #ff7eb3 0%, #9d7dfa 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(157, 125, 250, 0.3);
        }

        .modal-btn-confirm:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .modal-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="system-title-card">
    <div class="system-title">月月友生理期记录系统</div>
</div>

<div class="auth-card">
    <div class="input-group">
        <div class="label-shape shape-cloud">用户名</div>
        <input type="text" id="inp-username" class="custom-input" placeholder="请输入用户名" autocomplete="off">
    </div>

    <div class="input-group hidden" id="group-phone">
        <div class="label-shape shape-flag">电话</div>
        <input type="tel" id="inp-phone" class="custom-input" placeholder="请输入手机号" autocomplete="off">
    </div>

    <div class="input-group">
        <div class="label-shape shape-paper">密码</div>
        <input type="password" id="inp-password" class="custom-input" placeholder="请输入密码">
    </div>

    <button class="submit-btn" id="btn-submit">gogogo</button>
</div>

<div class="toggle-text" id="btn-toggle">没有账号，点击注册</div>

<div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
        <div class="modal-title">提示</div>
        <div class="modal-msg" id="modal-msg">...</div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-confirm" id="modal-confirm">我知道了</button>
        </div>
    </div>
</div>

<script>
    const BASE_URL = 'http://127.0.0.1:8088';
    const API_AUTH = `${BASE_URL}/record/auth`;

    let isLoginMode = true;

    const groupPhone = document.getElementById('group-phone');
    const inpUsername = document.getElementById('inp-username');
    const inpPhone = document.getElementById('inp-phone');
    const inpPassword = document.getElementById('inp-password');
    const btnSubmit = document.getElementById('btn-submit');
    const btnToggle = document.getElementById('btn-toggle');

    function showModal(message) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('custom-modal');
            const msgEl = document.getElementById('modal-msg');
            const btnConfirm = document.getElementById('modal-confirm');

            msgEl.innerText = message;
            overlay.classList.add('show');

            const cleanup = () => {
                overlay.classList.remove('show');
                btnConfirm.removeEventListener('click', onConfirm);
            };

            const onConfirm = () => { cleanup(); resolve(true); };
            btnConfirm.addEventListener('click', onConfirm);
        });
    }

    function setCookie(name, value, days = 30) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "expires=" + date.toUTCString();
        document.cookie = name + "=" + value + ";" + expires + ";path=/";
    }

    btnToggle.addEventListener('click', () => {
        isLoginMode = !isLoginMode;

        if (isLoginMode) {
            groupPhone.classList.add('hidden');
            btnSubmit.innerText = 'gogogo';
            btnToggle.innerText = '没有账号，点击注册';
            btnSubmit.style.background = 'linear-gradient(135deg, #ff7eb3 0%, #9d7dfa 100%)';
            btnSubmit.style.boxShadow = '0 8px 25px rgba(157, 125, 250, 0.4)';
        } else {
            groupPhone.classList.remove('hidden');
            btnSubmit.innerText = '注 册';
            btnToggle.innerText = '已有账号，点击登录';
            btnSubmit.style.background = 'linear-gradient(135deg, #17c3b2 0%, #43e97b 100%)';
            btnSubmit.style.boxShadow = '0 8px 25px rgba(23, 195, 178, 0.4)';
        }
    });

    btnSubmit.addEventListener('click', async () => {
        const username = inpUsername.value.trim();
        const password = inpPassword.value.trim();
        const phone = inpPhone.value.trim();

        if (!username) return showModal("用户名不能为空哦！");
        if (!password) return showModal("密码不能为空哦！");
        if (!isLoginMode && !phone) return showModal("注册需要填写手机号哦！");

        const payload = { username, password };
        if (!isLoginMode) {
            payload.phone = phone;
        }

        const endpoint = isLoginMode ? `${API_AUTH}/login` : `${API_AUTH}/register`;

        setTimeout(async () => {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (resData.code === "0000") {
                    const userId = resData.data.userId;
                    const returnedUsername = resData.data.username;

                    setCookie('userId', userId);
                    setCookie('username', returnedUsername);

                    const successMsg = isLoginMode ? "欢迎回来，月月友！" : "注册成功，欢迎加入月月友！";

                    // 等待用户点击弹窗的“我知道了”
                    await showModal(successMsg);

                    // ✨ 这里直接执行跳转，前往主页面 index.html ✨
                    window.location.href = "index.html";

                } else {
                    await showModal(resData.info || "操作失败，请重试");
                }
            } catch (error) {
                await showModal("网络请求失败，请检查后端服务是否开启！");
                console.error("请求报错:", error);
            }
        }, 150);
    });
</script>
</body>
</html>
