<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 - 月月友</title>
    <link rel="stylesheet" href="css/mine.css">
    <link rel="stylesheet" href="css/phone-shell.css">
    <link rel="stylesheet" href="css/polish.css">
</head>
<body>

<div class="header">
    <div class="app-title">我的</div>
    <div class="header-controls">
        <div class="ai-wallet-btn" id="btn-ai-wallet" role="button" tabindex="0">
            <span>🔋</span> 充值
        </div>
        <div class="avatar-container" id="profile-entry" role="button" tabindex="0">
            <div class="avatar" id="user-avatar"></div>
            <div class="username" id="user-name">加载中...</div>
        </div>
    </div>
</div>

<div class="content-scroll">
    <div class="glass-panel">
        <div class="menu-section-title">专属档案</div>
        <div class="menu-grid">
            <div class="menu-tile" data-action="user-info" role="button" tabindex="0">
                <div class="tile-icon icon-blue">👤</div>
                <div class="tile-title">用户信息</div>
            </div>
            <div class="menu-tile" data-action="persona" role="button" tabindex="0">
                <div class="tile-icon icon-pink">✨</div>
                <div class="tile-title">人物画像</div>
            </div>
            <div class="menu-tile" data-action="cycle-manager" role="button" tabindex="0">
                <div class="tile-icon icon-purple">📅</div>
                <div class="tile-title">生理期管理</div>
            </div>
            <div class="menu-tile" data-dev-feature="个人资产" role="button" tabindex="0">
                <div class="tile-icon icon-green">💰</div>
                <div class="tile-title">个人资产</div>
            </div>
        </div>
    </div>

    <div class="glass-panel">
        <div class="menu-section-title">系统与服务</div>
        <div class="menu-grid">
            <div class="menu-tile" data-dev-feature="提醒设置" role="button" tabindex="0">
                <div class="tile-icon icon-orange">🔔</div>
                <div class="tile-title">提醒设置</div>
            </div>
            <div class="menu-tile" data-dev-feature="通用设置" role="button" tabindex="0">
                <div class="tile-icon icon-gray">⚙️</div>
                <div class="tile-title">通用设置</div>
            </div>
        </div>
    </div>

    <div class="glass-panel">
        <div class="footer-links">
            <div class="footer-item" data-href="tel:17585345154" role="button" tabindex="0">
                <span>💬 意见反馈</span>
                <span class="footer-detail">17585345154</span>
            </div>
            <div class="footer-item" id="about-link" role="button" tabindex="0">
                <span>✨ 关于我们</span>
                <span class="footer-detail">v1.0.0</span>
            </div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" data-href="index.html" role="button" tabindex="0">主页</div>
    <div class="nav-item" data-href="data.html" role="button" tabindex="0">数据</div>
    <div class="nav-item active">我的</div>
</div>

<div class="modal-overlay" id="user-info-modal">
    <div class="glass-box">
        <div class="close-btn" data-close="user-info-modal" role="button" tabindex="0">×</div>
        <div class="modal-title">专属档案设置</div>

        <div class="form-scroll-container">
            <div class="avatar-edit-wrapper" id="avatar-random-btn">
                <div class="avatar-preview-lg" id="edit-avatar-preview"></div>
                <div class="avatar-edit-text">点击随机更换头像</div>
            </div>

            <div class="form-group">
                <label class="form-label">昵称 🌸</label>
                <input type="text" id="edit-username" class="glass-input" placeholder="输入你想用的昵称">
            </div>

            <div class="form-group">
                <label class="form-label">手机号 📱</label>
                <input type="tel" id="edit-phone" class="glass-input" placeholder="用于账号找回与提醒">
            </div>

            <div class="form-group">
                <label class="form-label">生日 🎂</label>
                <div class="date-input-wrapper">
                    <div class="date-input-backdrop date-input-backdrop-shadow"></div>
                    <input type="date" id="edit-birthday" class="glass-input date-glass-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label class="form-label">身高 📏 <span class="unit">cm</span></label>
                    <input type="number" id="edit-height" class="glass-input" placeholder="如: 165">
                </div>
                <div class="form-group half">
                    <label class="form-label">体重 ⚖️ <span class="unit">kg</span></label>
                    <input type="number" id="edit-weight" class="glass-input" placeholder="如: 50">
                </div>
            </div>
        </div>
        <button class="modal-btn modal-btn-confirm modal-submit-btn" id="btn-submit-user-info">保存档案</button>
    </div>
</div>

<div class="modal-overlay" id="cycle-manage-modal">
    <div class="glass-box cycle-manage-box">
        <div class="close-btn" data-close="cycle-manage-modal" role="button" tabindex="0">×</div>
        <div class="modal-title modal-title-tight">历史周期管理</div>

        <div id="cycle-list-container" class="cycle-list-container">
            <div class="cycle-cards-wrapper" id="cycle-cards-wrapper">
            </div>
            <div class="loading-text" id="cycle-loading-text">向下滑动加载更多...</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="cycle-edit-modal">
    <div class="glass-box cycle-edit-box">
        <div class="close-btn" data-close="cycle-edit-modal" role="button" tabindex="0">×</div>
        <div class="modal-title">修改周期区间</div>

        <input type="hidden" id="edit-cycle-id">
        <div class="form-group">
            <label class="form-label">开始时间 🟢</label>
            <div class="date-input-wrapper">
                <div class="date-input-backdrop"></div>
                <input type="date" id="edit-cycle-start" class="glass-input date-glass-input">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">结束时间 🔴</label>
            <div class="date-input-wrapper">
                <div class="date-input-backdrop"></div>
                <input type="date" id="edit-cycle-end" class="glass-input date-glass-input">
            </div>
        </div>

        <button class="modal-btn modal-btn-confirm modal-submit-btn" id="btn-confirm-cycle-edit">确认修改</button>
    </div>
</div>


<div class="modal-overlay" id="persona-modal">
    <div class="glass-box persona-box">
        <div class="close-btn" data-close="persona-modal" role="button" tabindex="0">×</div>
        <div class="modal-title">AI 人物画像</div>
        <div class="persona-content" id="persona-content">点击后将结合你的周期记录、症状和档案生成画像。</div>
    </div>
</div>
<div class="modal-overlay custom-modal-overlay" id="custom-modal">
    <div class="glass-box custom-modal-box">
        <div class="modal-title">提示</div>
        <div class="modal-msg" id="modal-msg">确认操作吗？</div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modal-cancel">取消</button>
            <button class="modal-btn modal-btn-confirm" id="modal-confirm">确认</button>
        </div>
    </div>
</div>
<script src="js/ui-enhance.js"></script>
<script src="js/mine.js"></script>
</body>
</html>
